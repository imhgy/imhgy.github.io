<div class="masthead">
    <div class="masthead__inner-wrap">
        <div class="masthead__menu">
            <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
                <a class="compact-brand" href="#Hello" target="_self">Guanyu Hu</a>
                <ul class="visible-links">
                    <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#Hello" target="_self">👋 Hi!</a></li>
                    {% for link in site.data.navigation.main %}
                    <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a></li>
                    {% endfor %}
                </ul>
                <button class="site-nav-toggle" type="button" aria-label="Open navigation" aria-controls="mobile-navigation" aria-expanded="false" hidden>
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </nav>
        </div>
    </div>
</div>
<dialog id="mobile-navigation" class="site-drawer" aria-label="Page navigation">
    <nav aria-label="Page sections" tabindex="-1">
        <ul class="site-drawer__links">
            <li><a href="#Hello" target="_self">About</a></li>
            {% for link in site.data.navigation.main %}
            <li><a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</dialog>
